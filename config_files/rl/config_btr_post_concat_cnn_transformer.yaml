# IQN + full BTR recipe (same as config_btr.yaml) with multimodal fusion:
#   - Vision: `nn.vis.cnn` drives the same `_build_img_head` as classic IQN (IMPALA / maxpool / spectral norm).
#   - Fusion: `nn.fusion_mode: post_concat` + `encoder.post_concat_layout: token_sequence` + native
#     `nn.encoder.transformer` (torch TransformerEncoder), float tokens `per_feature` (raw scalars).
# Train: python scripts/train.py --config config_files/rl/config_btr_post_concat_cnn_transformer.yaml
#
# Paper / BTR reference: https://arxiv.org/abs/2411.03820  |  Upstream: https://github.com/VIPTankz/BTR
#
# Hyperparameters / exploration / rewards / map_cycle / performance: tune as you like; ``memory:`` must be top-level (not inside ``training:``).

environment:
  tm_engine_step_per_action: 5 # 5
  ms_per_tm_engine_step: 10
  n_zone_centers_in_inputs: 40 # 40
  one_every_n_zone_centers_in_inputs: 20
  n_zone_centers_extrapolate_after_end_of_map: 1000
  n_zone_centers_extrapolate_before_start_of_map: 20 # 20
  distance_between_checkpoints: 0.5
  road_width: 90
  temporal_mini_race_duration_ms: 7000
  margin_to_announce_finish_meters: 700
  n_contact_material_physics_behavior_types: 4
  n_prev_actions_in_inputs: 25 # individual actions (25 × 10ms = 250ms; was 5 × 50ms = 250ms)
  cutoff_rollout_if_race_not_finished_within_duration_ms: 300000
  cutoff_rollout_if_no_vcp_passed_within_duration_ms: 2000
  timeout_during_run_ms: 10100
  timeout_between_runs_ms: 600000000
  tmi_protection_timeout_s: 500
  game_reboot_interval: 43200
  deck_height: "-inf"
  game_camera_number: 2
  sync_virtual_and_real_checkpoints: true
  # Multi-action: e.g. [0, 10, 20, 30, 40] for N=5 actions per block (10ms each). Omit or [0] = single action.
  # rl_action_offsets_ms: [0, 10, 20, 30, 40]

nn:
  vis:
    image_size:
      width: 64
      height: 64
    cnn:
      use_impala_cnn: true
      impala_model_size: 1
      use_adaptive_maxpool: true
      adaptive_maxpool_size: 6
      use_spectral_norm: true
  float:
    mlp:
      hidden_dim: 256
  fusion_mode: post_concat
  encoder:
    post_concat_layout: token_sequence
    float_token_input: raw
    float_token_layout: per_feature
    transformer:
      use_hf_backbone: false
      model_name_or_path: ""
      d_model: 128
      n_layers: 2
      n_heads: 4
      ff_mult: 4
      dropout: 0.1
  iqn:
    embedding_dimension: 64
    n: 8
    k: 32
    kappa: 0.005
  decoder:
    shared_input: post_tau
    dense_hidden_dimension: 512
    advantage:
      mlp:
        layers: 1
    value:
      mlp:
        layers: 1
  training:
    use_jit: true
    use_ddqn: false
    clip_grad_value: 1000
    clip_grad_norm: 10
    number_memories_trained_on_between_target_network_updates: 128
    soft_update_tau: 0.02
    target_self_loss_clamp_ratio: 4
    single_reset_flag: 0
    reset_every_n_frames_generated: 40000000000000
    additional_transition_after_reset: 1600000
    last_layer_reset_factor: 0.8
    overall_reset_mul_factor: 0.01

training:
  run_name: "A01_btr_iqn_post_concat_cnn_tf"
  # RL stack registry key. Topology = ``nn`` (post_concat fusion + IQN) + ``btr:`` below.
  algorithm: iqn
  # BTR main.py: --bs 256 (raise if learner waits on GPU)
  batch_size: 2048
  adam_epsilon: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.999
  # BTR Agent: adamw=False — no AdamW-style decoupled WD; disable custom WD scaling for parity
  weight_decay_lr_ratio: 0.1
  # Keep 1 so schedule step numbers are not multiplied (see config_loader._apply_schedule_speed)
  global_schedule_speed: 1
  lr_schedule:
    - [0, 0.001]
    - [3000000, 0.00005]
    - [12000000, 0.00005]
    - [15000000, 0.00001]
  gamma_schedule:
    - [0, 0.997]
    - [400000000, 0.997]
  n_steps: 3
  discard_non_greedy_actions_in_nsteps: true
  tensorboard_suffix_schedule:
    - [0, ""]
    - [6000000, "_2"]
    - [15000000, "_3"]
    - [30000000, "_4"]
    - [45000000, "_5"]
    - [80000000, "_6"]
    - [150000000, "_7"]
  oversample_long_term_steps: 40
  oversample_maximum_term_steps: 5

  # Visual pretraining — auto-inject encoder into IQN on first run.
  # Set to the encoder.pt path produced by pretrain_visual_backbone.py (script name unchanged; package is trackmania_rl.pretrain).
  # Behaviour:
  #   null  — no injection; IQN starts with random weights (default).
  #   path  — if save/<run_name>/weights1.torch does NOT yet exist,
  #            inject encoder.pt into a fresh IQN network pair and save
  #            weights1.torch + weights2.torch before training starts.
  #            If weights1.torch already exists (resumed run), injection
  #            is skipped to preserve training progress.
  # Example:
  #   pretrain_encoder_path: "output/ptretrain/vis/run_001/encoder.pt"
  # pretrain_encoder_path: "output/ptretrain/bc/v2_multi_offset_ahead_dropout_inner/encoder.pt"

  # BC full IQN state from BC run with use_full_iqn (iqn_bc.pt).
  # Path: BC run directory containing iqn_bc.pt, or path to iqn_bc.pt.
  # Loads img_head, float_feature_extractor, iqn_fc, A_head, V_head. Applied after encoder injection on fresh run.
  pretrain_bc_heads_path: null
  # pretrain_bc_heads_path: "output/ptretrain/bc/v5_multi_offset"

  # Piecewise: load only float_feature_extractor or A_head from BC run (use_floats+save_float_head / use_actions_head+save_actions_head).
  # Path: BC run directory (with float_head.pt / actions_head.pt) or path to the .pt file. Requires existing checkpoints (e.g. after encoder injection).
  #   pretrain_float_head_path: "output/ptretrain/bc/v2"
  pretrain_float_head_path: null
  #   pretrain_actions_head_path: "output/ptretrain/bc/v2"
  # pretrain_actions_head_path: "output/ptretrain/bc/v2_multi_offset_ahead_dropout_inner/actions_head.pt"

  # Freeze pretrain parts during RL (default: false).

# Top-level ``memory:`` only. Keys under ``training:`` are not loaded (see config_loader: MemoryConfig from ``memory``).
memory:
  memory_size_schedule:
    - [0, [50000, 20000]]
    - [5000000, [100000, 75000]]
    - [7000000, [200000, 150000]]
  prio_alpha: 0
  prio_epsilon: 0.002
  prio_beta: 1
  number_times_single_memory_is_used_before_discard: 32
  buffer_test_ratio: 0.05

exploration:
  # With btr.use_noisy_linear=true, IQN skips epsilon/Boltzmann during rollouts (NoisyNet only). Schedules kept for ablations.
  epsilon_schedule:
    - [0, 1]
    - [50000, 1]
    - [300000, 0.1]
    - [3000000, 0.03]
  epsilon_boltzmann_schedule:
    - [0, 0.15]
    - [10000000, 0.03]
  tau_epsilon_boltzmann: 0.01
  # When n_actions_per_block > 1: "per_action" (default) or "per_block"
  multi_action_exploration: per_block

rewards:
  constant_reward_per_ms: -0.0012
  reward_per_m_advanced_along_centerline: 0.01
  shaped_reward_dist_to_cur_vcp: -0.1
  shaped_reward_min_dist_to_cur_vcp: 2
  shaped_reward_max_dist_to_cur_vcp: 25
  engineered_reward_min_dist_to_cur_vcp: 5
  engineered_reward_max_dist_to_cur_vcp: 25
  shaped_reward_point_to_vcp_ahead: 0
  # Small bonuses/penalties throughout training ([[frames, value]] — must include step 0)
  engineered_speedslide_reward_schedule: [[0, 0.000], [4500000, 0.000], [5000000, 0.001], [15000000, 0.0]]
  engineered_neoslide_reward_schedule: [[0, 0.000], [4500000, 0.000], [5000000, 0.001], [15000000, 0.0]]
  engineered_kamikaze_reward_schedule: [[0, 0.0]]
  engineered_close_to_vcp_reward_schedule: [[0, 0.0]]
  final_speed_reward_as_if_duration_s: 5

# BTR stack — all ON (full recipe). Toggle individual flags for ablations.
btr:
  # Munchausen (Agent sets entropy_tau=0.03, lo=-1, alpha=munch_alpha)
  use_munchausen: true
  munchausen_alpha: 0.9
  munchausen_entropy_tau: 0.03
  munchausen_lo: -1.0

  # Paper lists LayerNorm as an ingredient; upstream argparse defaults layer_norm=0 — enable for “full six”
  use_layer_norm: true

  use_noisy_linear: true
  noisy_sigma0: 0.5

map_cycle:
  entries:
    # - {short_name: hock, map_path: "ESL-Hockolicious.Challenge.Gbx", reference_line_path: "ESL-Hockolicious_0.5m_cl2.npy", is_exploration: true, fill_buffer: true, repeat: 64}
    - {short_name: A01, map_path: '"A01-Race.Challenge.Gbx"', reference_line_path: "A01_0.5m_cl.npy", is_exploration: true, fill_buffer: true, repeat: 64}
    - {short_name: A01, map_path: '"A01-Race.Challenge.Gbx"', reference_line_path: "A01_0.5m_cl.npy", is_exploration: false, fill_buffer: true, repeat: 1}

performance:
  gpu_collectors_count: 4
  max_rollout_queue_size: 4
  send_shared_network_every_n_batches: 128
  update_inference_network_every_n_actions: 128
  plot_race_time_left_curves: false
  n_transitions_to_plot_in_distribution_curves: 1000
  make_highest_prio_figures: false
  apply_randomcrop_augmentation: false
  n_pixels_to_crop_on_each_side: 2
  frames_before_save_best_runs: 1500000
  threshold_to_save_all_runs_ms: -1
  running_speed: 32
  # Pin each TmForever.exe to one logical CPU: collector i -> tm_forever_cpu_affinity_offset + i
  pin_tm_forever_cpu_affinity: false
  # tm_forever_cpu_affinity_offset: 0
  # Or per-collector list (length >= gpu_collectors_count): tm_forever_cpu_affinity_cpus: [0,1,2,3,4,5,6,7]

inputs:
  actions:
    - {left: false, right: false, accelerate: true, brake: false}
    - {left: true, right: false, accelerate: true, brake: false}
    - {left: false, right: true, accelerate: true, brake: false}
    - {left: false, right: false, accelerate: false, brake: false}
    - {left: true, right: false, accelerate: false, brake: false}
    - {left: false, right: true, accelerate: false, brake: false}
    - {left: false, right: false, accelerate: false, brake: true}
    - {left: true, right: false, accelerate: false, brake: true}
    - {left: false, right: true, accelerate: false, brake: true}
    - {left: false, right: false, accelerate: true, brake: true}
    - {left: true, right: false, accelerate: true, brake: true}
    - {left: false, right: true, accelerate: true, brake: true}
  action_forward_idx: 0
  action_backward_idx: 6

