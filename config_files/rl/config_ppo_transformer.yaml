# PPO: nn.fusion_mode post_concat + token_sequence + HF timm vision (patch_tokens) + float per_feature → HF fusion encoder (BERT-class).
# Filename is historical ("transformer"); this is NOT nn.fusion_mode vision_transformer (native patch + torch fuse — start from config_ppo.yaml and switch fusion_mode / vis.transformer).
# pip install -e ".[policy]" (includes timm for Hub ids like timm/vit_*).
# python scripts/train.py --config config_files/rl/config_ppo_transformer.yaml

environment:
  tm_engine_step_per_action: 5
  ms_per_tm_engine_step: 10
  n_zone_centers_in_inputs: 40
  one_every_n_zone_centers_in_inputs: 20
  n_zone_centers_extrapolate_after_end_of_map: 1000
  n_zone_centers_extrapolate_before_start_of_map: 20
  distance_between_checkpoints: 0.5
  road_width: 90
  temporal_mini_race_duration_ms: 7000
  margin_to_announce_finish_meters: 700
  n_contact_material_physics_behavior_types: 4
  n_prev_actions_in_inputs: 25
  cutoff_rollout_if_race_not_finished_within_duration_ms: 300000
  cutoff_rollout_if_no_vcp_passed_within_duration_ms: 2000
  timeout_during_run_ms: 10100
  timeout_between_runs_ms: 600000000
  tmi_protection_timeout_s: 500
  game_reboot_interval: 43200
  deck_height: "-inf"
  game_camera_number: 2
  sync_virtual_and_real_checkpoints: true
  # Multi-action: e.g. [0, 10, 20, 30, 40]. Default [0] is single action per decision.
  # rl_action_offsets_ms: [0, 10, 20, 30, 40]

nn:
  vis:
    freeze: true
    image_size:
      width: 64
      height: 64
    transformer:
      use_hf_backbone: true
      model_name_or_path: timm/vit_xsmall_patch16_clip_224.tinyclip_yfcc15m
      trust_remote_code: true
      fusion_tokens: patch_tokens
      d_model: 384
      n_layers: 0
  fusion_mode: post_concat
  encoder:
    freeze: false
    post_concat_layout: token_sequence
    float_token_layout: per_feature
    transformer:
      use_hf_backbone: true
      model_name_or_path: google/bert_uncased_L-2_H-128_A-2
      n_layers: 0
  decoder:
    dense_hidden_dimension: 1024
  training:
    use_jit: true

# Shared with PPO learner: optimizer, LR schedule, TB suffix. IQN-only keys omitted (replay, n-step, gamma_schedule, batch_size).
training:
  run_name: "ppo_post_concat_tinyclip_xs_patchtok_float_per_feat_bert_L2H128"
  algorithm: ppo
  # BC v6 PPO fusion (pretrain_config_bc_v6_ppo_transformer_multi_offset.yaml): set to BC run dir so ppo_policy_bc.pt → weights1.torch
  # on first launch (same nn topology via rl_config_path). Example: output/ptretrain/bc/v6_ppo_transformer_multi_avg
  pretrain_ppo_policy_path: "output/ptretrain/bc/v6_ppo_transformer_multi_avg"
  # If BC was trained with more discrete actions than RL (same leading indices, e.g. RL drops brake): enable truncation.
  pretrain_ppo_policy_slice_head_to_model: true
  adam_epsilon: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.999
  global_schedule_speed: 1
  lr_schedule:
    - [0, 0.001]
    - [3000000, 0.00001]
    - [12000000, 0.000005]
    - [15000000, 0.000001]
  tensorboard_suffix_schedule:
    - [0, ""]
    - [6000000, "_2"]
    - [15000000, "_3"]
    - [30000000, "_4"]
    - [45000000, "_5"]
    - [80000000, "_6"]
    - [150000000, "_7"]

ppo:
  # Scalars = step-0 fallback if a *_schedule block is removed; when schedules are set, they define the run (linear interp vs frames).
  # gamma: 0.99
  # gae_lambda: 0.95
  # ent_coef: 0.03
  # vf_coef: 0.5
  clip_coef: 0.2
  clip_coef_vf: 0.2
  max_grad_norm: 0.2
  update_epochs: 4
  num_minibatches: 4
  normalize_advantages: true
  rollout_steps_per_update: 2048
  # Same [[frame, value], ...] shape as training.lr_schedule; frame counts × training.global_schedule_speed.
  # Linear between knots (like IQN gamma / reward schedules). Not exponential like lr_schedule.
  # ppo_gamma_schedule: IQN reserves training.gamma_schedule — this is PPO discount γ only.
  ppo_gamma_schedule:
    - [0, 0.99]
    - [12000000, 0.995]
    - [30000000, 0.997]
  gae_lambda_schedule:
    - [0, 0.95]
    - [15000000, 0.97]
  # Discrete actions: entropy coef often ~1e-3–1e-2; decay as policy sharpens (SB3-style constant small coef, here explicit decay).
  ent_coef_schedule:
    - [0, 0.001]
    # - [200000, 0.03]
    - [15000000, 0.0005]
  vf_coef_schedule:
    - [0, 0.5]
    - [15000000, 0.1]

rewards:
  constant_reward_per_ms: 0 # -0.0012
  reward_per_m_advanced_along_centerline: 0.02
  shaped_reward_dist_to_cur_vcp: 0 # -0.1
  shaped_reward_min_dist_to_cur_vcp: 0 # 2
  shaped_reward_max_dist_to_cur_vcp: 0 # 25
  engineered_reward_min_dist_to_cur_vcp: 5
  engineered_reward_max_dist_to_cur_vcp: 25
  shaped_reward_point_to_vcp_ahead: 0
  # Small bonuses/penalties throughout training ([[frames, value]] — must include step 0)
  engineered_speedslide_reward_schedule: [[0, 0.000], [4500000, 0.000], [5000000, 0.001], [15000000, 0.0]]
  engineered_neoslide_reward_schedule: [[0, 0.000], [4500000, 0.000], [5000000, 0.001], [15000000, 0.0]]
  engineered_kamikaze_reward_schedule: [[0, 0.0]]
  engineered_close_to_vcp_reward_schedule: [[0, 0.0]]
  final_speed_reward_as_if_duration_s: 5

map_cycle:
  entries:
    - {short_name: A01, map_path: '"A01-Race.Challenge.Gbx"', reference_line_path: "A01_0.5m_cl.npy", is_exploration: true, fill_buffer: true, repeat: 64}
    - {short_name: A01, map_path: '"A01-Race.Challenge.Gbx"', reference_line_path: "A01_0.5m_cl.npy", is_exploration: false, fill_buffer: true, repeat: 1}

performance:
  gpu_collectors_count: 4
  max_rollout_queue_size: 4
  update_inference_network_every_n_actions: 128
  running_speed: 32
  pin_tm_forever_cpu_affinity: false

inputs:
  actions:
    - {left: false, right: false, accelerate: true, brake: false}
    - {left: true, right: false, accelerate: true, brake: false}
    - {left: false, right: true, accelerate: true, brake: false}
    - {left: false, right: false, accelerate: false, brake: false}
    - {left: true, right: false, accelerate: false, brake: false}
    - {left: false, right: true, accelerate: false, brake: false}
    # - {left: false, right: false, accelerate: false, brake: true}
    # - {left: true, right: false, accelerate: false, brake: true}
    # - {left: false, right: true, accelerate: false, brake: true}
    # - {left: false, right: false, accelerate: true, brake: true}
    # - {left: true, right: false, accelerate: true, brake: true}
    # - {left: false, right: true, accelerate: true, brake: true}
  action_forward_idx: 0
  action_backward_idx: 6

